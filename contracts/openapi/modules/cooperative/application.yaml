      operationId: saveHouseholdYieldEstimate
      summary: Nhập, sửa hoặc xóa sản lượng lúa, rơm dự kiến của vụ theo hộ (AH-87)
      description: Thành viên HTX/Admin (KHMV-FN-04 U); Đại diện HTX chỉ xem (403). Chỉ vụ "Đang canh tác". Body là toàn bộ giá trị người dùng nhập cho vụ; null (hoặc bỏ trường) = dùng giá trị hệ thống tính (KH-05). Tấn ≥ 0, tối đa 2 chữ số lẻ (KH-26), không quá giới hạn cột lưu. Gửi straw_t cho vụ không phải lúa bị từ chối cả lệnh (422 theo trường straw_t). Rơm hệ thống tính lại theo lúa đang có hiệu lực, hệ số rơm đã chụp lúc mở vụ; rơm người dùng nhập không đổi. expected_seq là seq hiện hành (0 khi vụ chưa có bản ghi); lệch thì 409 yield_estimate_changed. Phát lại cùng Idempotency-Key trả kết quả cũ.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_seq]
              properties:
                expected_seq: {type: integer, minimum: 0}
                rice_t: {type: [string, "null"], pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
                straw_t: {type: [string, "null"], pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
      responses:
        "200":
          description: Sản lượng dự kiến sau khi ghi
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [yield_estimate]
                properties:
                  yield_estimate: {$ref: "#/components/schemas/HouseholdYieldEstimate"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 10023
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/harvest:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: declareHouseholdHarvest
      summary: Khai báo sản lượng thu hoạch của một vụ theo hộ (AH-100)
      description: Thành viên HTX/Admin (KHMV-FN-06 C); Đại diện HTX chỉ xem (403). Chỉ vụ "Đang canh tác" (khác → 409 season_state, dùng Sửa sản lượng); expected_season_event_id phải là phiên bản hiện tại (409 task_season_changed). Tổng sản lượng cả vụ theo tấn, ≥ 0, tối đa 2 chữ số lẻ (KH-26); bằng 0 cần zero_confirmed (409 harvest_zero_confirmation_required, KH-19); không còn ngưỡng bất thường (KH-09). Mốc gốc ≤ harvest_date ≤ hôm nay (GMT+7). Vụ chuyển "Đã thu hoạch" (status completed), diện tích được giải phóng, ngày thu hoạch thành mốc NTT; mọi việc Thu hoạch chưa Xong (kể cả Bỏ qua) tự Xong theo ngày đó (auto_completed_steps). Phát lại cùng Idempotency-Key trả kết quả cũ (200).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_season_event_id, mass_t, harvest_date, gps]
              properties:
                expected_season_event_id: {type: string, format: uuid}
                mass_t: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
                harvest_date: {type: string, format: date}
                zero_confirmed: {type: boolean, default: false}
                gps: {$ref: "#/components/schemas/CropGPS"}
                channel: {type: string, enum: [app, web], default: app}
      responses:
        "201":
          description: Đã khai báo; vụ "Đã thu hoạch"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdHarvestResult"}
        "200":
          description: Phát lại cùng Idempotency-Key
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdHarvestResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10025
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/harvest/corrections:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: correctHouseholdHarvest
      summary: Sửa sản lượng, ngày thu hoạch của vụ theo hộ đã khai báo (AH-189)
      description: Thành viên HTX/Admin (KHMV-FN-06 U); Đại diện HTX chỉ xem (403). Chỉ vụ "Đã thu hoạch" (409 season_state). expected_harvest_id phải là khai báo hiện hành (409 concurrent_edit). Kiểm như lúc khai báo (Q-15) — tấn ≥ 0, tối đa 2 chữ số lẻ, 0 cần zero_confirmed, mốc gốc ≤ harvest_date ≤ hôm nay. Lý do tùy chọn ở vụ "Đã thu hoạch" (bỏ trống thì máy chủ ghi câu chuẩn); bắt buộc khi vụ đã hoàn thành (AH-152). Ghi bản bù chỉ ghi thêm (cũ → mới, người, thời điểm). Đổi ngày thu hoạch thì việc Thu hoạch tự Xong đổi theo; việc người dùng tự tích giữ nguyên.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_harvest_id, mass_t, harvest_date]
              properties:
                expected_harvest_id: {type: string, format: uuid}
                mass_t: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
                harvest_date: {type: string, format: date}
                zero_confirmed: {type: boolean, default: false}
                reason: {type: string, maxLength: 500}
                channel: {type: string, enum: [app, web], default: web}
      responses:
        "200":
          description: Khai báo sau khi sửa
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [season, harvest]
                properties:
                  season: {$ref: "#/components/schemas/HouseholdSeason"}
                  harvest: {$ref: "#/components/schemas/HouseholdHarvest"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10026
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/harvest/void:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: voidHouseholdHarvest
      summary: Hủy khai báo sản lượng của vụ theo hộ "Đã thu hoạch" (AH-189)
      description: Thành viên HTX/Admin (KHMV-FN-06 D); Đại diện HTX chỉ xem (403). Chỉ vụ "Đã thu hoạch" (vụ đã hoàn thành → 409 season_state). Lý do 10–500 ký tự, không SĐT/CCCD. expected_harvest_id phải là khai báo hiện hành. Vụ về "Đang canh tác" nếu không làm tổng diện tích đang canh tác vượt diện tích đất (409 household_area_exceeded kèm remaining_area_ha). Việc Thu hoạch tự Xong về trạng thái trước; việc theo mốc NTT chưa xong về trạng thái trước khai báo. Mọi bản ghi được giữ (lịch sử).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_harvest_id, reason]
              properties:
                expected_harvest_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10, maxLength: 500}
                channel: {type: string, enum: [app, web], default: web}
      responses:
        "200":
          description: Vụ sau khi hủy khai báo (Đang canh tác)
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdSeason"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10027
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/harvest/history:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: householdHarvestHistory
      summary: Lịch sử khai báo sản lượng của vụ theo hộ (AH-189)
      description: Mọi phiên bản theo thứ tự ghi — khai báo, sửa, hủy — kèm sản lượng, ngày, người, thời điểm, lý do. Người xem được vụ đều xem được (cả Đại diện HTX).
      responses:
        "200":
          description: Các phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HouseholdHarvestVersion"}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 10028
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/summary:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: householdSeasonSummary
      summary: Tổng kết "Ghi lại vụ" của vụ theo hộ (AH-152)
      description: Người xem được vụ đều xem được (Đại diện HTX chỉ xem). Vụ chưa hoàn thành — tự tính năng suất, tổng vật tư theo liều thực tế, số việc sớm / đúng hạn / trễ / bỏ qua / chưa làm (không tính việc tổng kết vụ), kèm điều kiện hoàn thành vụ. Vụ "Đã hoàn thành vụ" — bản chụp cố định lúc hoàn thành (KH-27) kèm chi phí, ghi chú; sửa sản lượng sau đó không đổi bản chụp.
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdSeasonSummary"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 10029
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/close:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: closeHouseholdSeason
      summary: Hoàn thành vụ theo hộ (AH-152)
      description: Thành viên HTX/Admin (KHMV-FN-06 U); Đại diện HTX chỉ xem (403). Chỉ vụ "Đã thu hoạch" — vụ đang canh tác chưa khai báo sản lượng → 409 season_harvest_required; mọi việc giai đoạn cuối (trừ việc tổng kết vụ) phải Xong hoặc Bỏ qua → 409 season_last_stage_unresolved kèm unresolved_steps; vụ đã hoàn thành, đã dừng → 409 season_state; expected_season_event_id lệch → 409 concurrent_edit. Chi phí tùy chọn (số nguyên VND ≥ 0, tối đa 12 chữ số); ghi chú tùy chọn ≤ 1000 ký tự, không SĐT/CCCD. Ghi bản chụp tổng kết cố định, việc tổng kết vụ (nếu có) thành Xong, vụ chuyển "Đã hoàn thành vụ" — không quay lại; chặn ghi việc; sửa sản lượng bắt buộc lý do; không hủy khai báo.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_season_event_id]
              properties:
                expected_season_event_id: {type: string, format: uuid}
                cost_vnd: {type: string, pattern: '^[0-9]{0,12}$', description: "Chi phí cả vụ (VND, số nguyên); bỏ trống = không nhập"}
                note: {type: string, maxLength: 1000}
                gps: {$ref: "#/components/schemas/CropGPS"}
                channel: {type: string, enum: [app, web], default: web}
      responses:
        "201":
          description: Vụ đã hoàn thành
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [season, summary]
                properties:
                  season: {$ref: "#/components/schemas/HouseholdSeason"}
                  summary: {$ref: "#/components/schemas/HouseholdSeasonSummary"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 10028
    HouseholdSeasonSummary:
      type: object
      description: "Tổng kết vụ theo hộ (AH-152). Tấn 2 chữ số lẻ; vật tư cộng theo (tên, đơn vị) từ các bản ghi việc đang hiệu lực."
      required: [status, area_ha, mass_t, mass_kg, yield_t_per_ha, harvest_date, materials, tasks, summary_step_seq, can_close, blockers, unresolved_steps, harvest_reminder, cost_vnd, note, closed_at, closed_by]
      properties:
        status: {type: string, enum: [open, completed, cancelled, closed]}
        area_ha: {type: string}
        mass_t: {type: [string, "null"]}
        mass_kg: {type: [string, "null"]}
        yield_t_per_ha: {type: [string, "null"]}
        harvest_date: {type: [string, "null"], format: date}
        materials:
          type: array
          items:
            type: object
            required: [name, unit, qty]
            properties:
              name: {type: string}
              unit: {type: string}
              qty: {type: string}
        tasks:
          type: object
          required: [early, on_time, late, skipped, not_done, total]
          properties:
            early: {type: integer, minimum: 0}
            on_time: {type: integer, minimum: 0}
            late: {type: integer, minimum: 0}
            skipped: {type: integer, minimum: 0}
            not_done: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
        summary_step_seq: {type: [integer, "null"], description: "Việc tổng kết vụ của quy trình (nếu có)"}
        can_close: {type: boolean}
        blockers: {type: array, items: {type: string, enum: [harvest_required, last_stage_unresolved]}}
        unresolved_steps: {type: array, items: {type: integer}, description: "Việc giai đoạn cuối chưa Xong hoặc Bỏ qua"}
        harvest_reminder: {type: boolean, description: "Vụ đang canh tác đã xong giai đoạn cuối — nhắc khai báo sản lượng"}
        cost_vnd: {type: [string, "null"]}
        note: {type: [string, "null"]}
        closed_at: {type: [string, "null"], format: date-time}
        closed_by: {type: [string, "null"], format: uuid}
# @ag-order: 10025
    HouseholdHarvestVersion:
      allOf:
        - {$ref: "#/components/schemas/HouseholdHarvest"}
        - type: object
          required: [kind, supersedes_id, reason]
          properties:
            kind: {type: string, enum: [declared, corrected, voided]}
            supersedes_id: {type: [string, "null"], format: uuid}
            reason: {type: [string, "null"]}
# @ag-order: 10023
    HouseholdHarvest:
      type: object
      description: "Khai báo sản lượng hiện hành của vụ theo hộ (AH-100)"
      required: [harvest_id, mass_t, mass_kg, harvest_date, yield_t_per_ha, zero_confirmed, declared_by, declared_at]
      properties:
        harvest_id: {type: string, format: uuid}
        mass_t: {type: string, description: "Tổng sản lượng cả vụ (tấn, 2 chữ số lẻ)"}
        mass_kg: {type: string}
        harvest_date: {type: string, format: date}
        yield_t_per_ha: {type: string, description: "Năng suất = sản lượng ÷ diện tích vụ (tấn/ha)"}
        zero_confirmed: {type: boolean}
        declared_by: {type: string, format: uuid}
        declared_at: {type: string, format: date-time}
# @ag-order: 10024
    HouseholdHarvestResult:
      type: object
      required: [season, harvest, auto_completed_steps]
      properties:
        season: {$ref: "#/components/schemas/HouseholdSeason"}
        harvest: {$ref: "#/components/schemas/HouseholdHarvest"}
        auto_completed_steps: {type: array, items: {type: integer}, description: "Số việc Thu hoạch vừa được tự Xong"}
# @ag-order: 10022
    HouseholdYieldEstimate:
      type: object
      description: "Sản lượng lúa, rơm dự kiến của vụ theo hộ (AH-87, KH-05). Giá trị có hiệu lực = giá trị nhập, nếu không có thì giá trị hệ thống tính. Tấn 2 chữ số lẻ, làm tròn half-up."
      required: [seq, is_rice, area_ha, conventional_yield_t_per_ha, straw_pct, computed_rice_t, computed_straw_t, entered_rice_t, entered_straw_t, rice_t, straw_t, updated_at, updated_by]
      properties:
        seq: {type: integer, minimum: 0, description: "Phiên bản hiện hành; 0 = vụ mở trước AH-87, tính tại chỗ theo tham số hiện hành"}
        is_rice: {type: boolean}
        area_ha: {type: string}
        conventional_yield_t_per_ha: {type: string, description: "Năng suất quy ước đã chụp (t/ha)"}
        straw_pct: {type: [string, "null"], description: "Hệ số rơm (%) đã chụp; null với vụ không phải lúa"}
        computed_rice_t: {type: string}
        computed_straw_t: {type: [string, "null"]}
        entered_rice_t: {type: [string, "null"]}
        entered_straw_t: {type: [string, "null"]}
        rice_t: {type: string, description: "Lúa dự kiến có hiệu lực (tấn)"}
        straw_t: {type: [string, "null"], description: "Rơm dự kiến có hiệu lực (tấn); null với vụ không phải lúa"}
        updated_at: {type: [string, "null"], format: date-time}
        updated_by: {type: [string, "null"], format: uuid}
# @ag-order: 10017
    HouseholdTaskBatchCandidate:
      type: object
      required: [household_ref, season_ref, season_code, season_year, variety_code, status, current_event_id, eligible, is_source]
      properties:
        household_ref: {type: string, format: uuid}
        season_ref: {type: string, format: uuid}
        season_code: {type: string}
        season_year: {type: integer}
        variety_code: {type: string}
        status: {type: string}
        current_event_id: {type: string, format: uuid}
        step_seq: {type: integer, description: "Số việc tương ứng trong vụ (có thể khác vụ nguồn giữa các phiên bản SOP)"}
        eligible: {type: boolean}
        is_source: {type: boolean}
        code: {type: string, description: "Mã lý do không ghi được"}
        reason: {type: string}
# @ag-order: 10018
    HouseholdTaskBatchResult:
      type: object
      required: [household_ref, season_ref, status]
      properties:
        household_ref: {type: string, format: uuid}
        season_ref: {type: string, format: uuid}
        status: {type: string, enum: [recorded, skipped]}
        step_seq: {type: integer}
        record: {$ref: "#/components/schemas/HouseholdTaskRecord"}
        replayed: {type: boolean}
        code: {type: string, description: "Mã lý do bỏ qua, vd cropcycle.task_already_resolved, cropcycle.batch_task_mismatch"}
        reason: {type: string}
# @ag-order: 10015
    HouseholdPlanChange:
      type: object
      additionalProperties: false
      required: [kind]
