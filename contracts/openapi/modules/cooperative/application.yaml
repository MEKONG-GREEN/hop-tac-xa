paths:
# @ag-order: 10007
  /v1/households/{ref}/photo-key:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHouseholdPhotoKey
      summary: Khóa công khai để mã hóa ảnh nhật ký cho hộ (AH-99)
      description: Chỉ người được ghi nhật ký; kiểm phạm vi HTX hiện tại trước và sau khi đọc khóa. Không cấp quyền giải mã hoặc đọc định danh.
      responses:
        "200":
          description: Khóa X25519 32 byte dạng base64
          content:
            application/json:
              schema:
                type: object
                required: [ref, public_key]
                properties:
                  ref: {type: string, format: uuid}
                  public_key: {type: string, contentEncoding: base64}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 10006
  /v1/cooperatives/{ref}/season-calendars:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [CropCycle]
      operationId: listSeasonCalendars
      summary: Lịch của HTX; Thành viên chỉ nhận lịch mình được chọn, chưa hủy
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Danh sách trong phạm vi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SeasonCalendar"}}
                  next_cursor: {type: [string, "null"], format: uuid}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [CropCycle]
      operationId: publishSeasonCalendar
      summary: Admin hoặc Đại diện phát lịch và xếp thông báo sau commit
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SeasonCalendarInput"}
      responses:
        "201":
          description: Lịch đã phát; không khẳng định push đã gửi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SeasonCalendar"}
        default: {$ref: "#/components/responses/Problem"}
# @ag-order: 10007
  /v1/cooperatives/{ref}/season-calendars/{calendar_ref}/revisions:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: calendar_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [CropCycle]
      operationId: reviseSeasonCalendar
      summary: Sửa lịch đã phát và xếp thông báo mới
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SeasonCalendarRevisionInput"}
      responses:
        "201":
          description: Phiên bản mới, hoặc replay cùng key và nội dung
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SeasonCalendar"}
        default: {$ref: "#/components/responses/Problem"}
# @ag-order: 10008
  /v1/cooperatives/{ref}/season-calendars/{calendar_ref}/cancel:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: calendar_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [CropCycle]
      operationId: cancelSeasonCalendar
      summary: Hủy, không gửi thông báo và không sửa vụ đã mở
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_event_id]
              properties:
                expected_event_id: {type: string, format: uuid}
      responses:
        "201":
          description: Lịch đã hủy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SeasonCalendar"}
        default: {$ref: "#/components/responses/Problem"}
# @ag-order: 10009
  /v1/cropcycle/calendars/{calendar_ref}:
    get:
      tags: [CropCycle]
      operationId: getSeasonCalendar
      summary: Đích deep link thông báo; kiểm phiên bản và quyền hiện tại
      parameters:
        - {name: calendar_ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lịch; không lộ người nhận khác cho Thành viên
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SeasonCalendar"}
        default: {$ref: "#/components/responses/Problem"}
# @ag-order: 10010
  /v1/cooperatives/{ref}/season-calendar-recipients:
    get:
      tags: [CropCycle]
      operationId: listSeasonCalendarRecipients
      summary: Danh bạ Thành viên hoạt động, chỉ Admin và Đại diện đúng HTX
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Cache-Control no-store; trang có thể rỗng nhưng còn next_offset khi lọc vai
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  next_offset: {type: integer, minimum: 0}
                  items:
                    type: array
                    items:
                      type: object
                      required: [actor_ref, label]
                      properties:
                        actor_ref: {type: string, format: uuid}
                        label: {type: string, description: "Tên hiển thị nếu có, không thay bằng SĐT/tên đăng nhập"}
        default: {$ref: "#/components/responses/Problem"}
# @ag-order: 10004
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/checklist:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHouseholdChecklist
      summary: Checklist và tiến độ theo snapshot của vụ (AH-88)
      description: Cùng HTX; Đại diện chỉ đọc. Không cần duyệt nhật ký theo hộ. Phần trăm null khi mọi việc bỏ qua; hiển thị —.
      responses:
        "200":
          description: Checklist và bản ghi hiện hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdChecklist"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10005
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/task-completions:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: completeHouseholdTask
      summary: Xác nhận tích hoàn thành việc hôm nay (AH-88)
      description: Thành viên cùng HTX/Admin. Khóa vụ rồi kiểm snapshot, trạng thái và phiên bản. Sau thu hoạch chỉ việc chưa xong ở giai đoạn cuối; dừng/đóng bị từ chối. Liều khuyến cáo và ngày GMT+7 do server lấy; GPS/thời điểm/actor bất biến. Thiếu GPS vẫn lưu. Cùng thao tác giữ key và GPS khi thử lại. Hộ inactive vẫn tiếp tục vụ được phép ghi. Không ghi vào outbox theo thửa cũ.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HouseholdTaskCompleteInput"}
      responses:
        "201":
          description: Bản ghi hoàn thành cùng tiến độ mới; replay không tạo bản ghi khác
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [record, checklist]
                properties:
                  record: {$ref: "#/components/schemas/HouseholdTaskRecord"}
                  checklist: {$ref: "#/components/schemas/HouseholdChecklist"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10006
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/task-records:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: recordHouseholdTask
      summary: Ghi chi tiết việc và vật tư thực tế (AH-99)
      description: Thành viên cùng HTX/Admin; Đại diện chỉ đọc. Một ngày làm xong; ghi nhiều lần partial trước khi done. Liều theo ha, tổng bằng liều nhân diện tích vụ; không đổi SOP. Ảnh phải do chính actor tải lên cho hộ, tối đa 5 ảnh, mỗi ảnh bản rõ không quá 1 MiB. Ghi bù quá 3 ngày cần lý do, trừ việc Không ngày. Không có cảnh báo lệch liều.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HouseholdTaskDetailInput"}
      responses:
        "201":
          description: Bản ghi chi tiết và checklist; replay trả bản ghi cũ
          content:
            application/json:
              schema:
                type: object
                required: [record, checklist]
                properties:
                  record: {$ref: "#/components/schemas/HouseholdTaskRecord"}
                  checklist: {$ref: "#/components/schemas/HouseholdChecklist"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 10002
  /v1/cooperatives/{ref}/households/{household_ref}/season-plan-preview:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: previewHouseholdSchedule
      summary: Lập hoặc tính lại kế hoạch trước mở vụ (AH-71)
      description: Chỉ Thành viên HTX/Admin. Đủ giống, SOP và mốc gốc mới lập kế hoạch. Không ghi vụ hoặc sản lượng. Mỗi lần đổi input dùng một Idempotency-Key mới. Ngày nghiệp vụ GMT+7; Không ngày luôn đến hạn, Mở không có ngày Đến.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SeasonSchedulePreviewInput"}
      responses:
        "200":
          description: Kế hoạch theo SOP đang áp dụng, current_event_id null
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SeasonSchedule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 10003
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/plan:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHouseholdSchedule
      summary: Đọc lịch theo snapshot và mốc hiện tại của vụ (AH-71)
      description: Đại diện được đọc cùng HTX. SOP master phát hành mới hoặc ngừng không thay lịch của vụ đã ghim. Kết quả dẫn xuất không sửa sản lượng ghi tay. Snapshot cũ thiếu cửa sổ ngày trả 422, không bịa ngày từ offset tạm.
      responses:
        "200":
          description: Kế hoạch cùng current_event_id của vụ; ngày tính theo GMT+7
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SeasonSchedule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10000
  /v1/cooperatives/{ref}/households/{household_ref}/seasons:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}, description: "HTX đích, server kiểm theo phiên"}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Mở vụ theo nông hộ và diện tích còn lại (AH-61)
      description: |
        Chỉ Thành viên HTX của HTX đích hoặc Admin được mở; Đại diện chỉ đọc.
        Diện tích dương, tối đa hai chữ số thập phân, không vượt diện tích còn lại.
        Server khóa hộ và đọc lại tổng diện tích trước ghi. Hộ ngừng tham gia không mở mới.
        Mốc gốc tự chọn, không áp dụng cửa sổ T−15/T+30 của API theo thửa cũ.
        SOP đang áp dụng riêng của giống được ưu tiên; không có thì dùng SOP chung của loại cây.
        Server lưu snapshot SOP, không nhận snapshot do client gửi.
        Mở vụ cần mạng; không đưa yêu cầu vào hàng đợi đồng bộ. Thiếu hoặc từ chối GPS vẫn lưu được.
        Thử lại cùng thao tác dùng lại Idempotency-Key và giữ nguyên dữ liệu form.
      operationId: openHouseholdSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HouseholdSeasonOpenInput"}
      responses:
        "201":
          description: Vụ đang canh tác; replay trả đúng phản hồi cũ. Client tải lại danh sách hộ để cập nhật diện tích hiện tại.
          headers:
            Location: {schema: {type: string}}
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [season]
                properties:
                  season: {$ref: "#/components/schemas/HouseholdSeason"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: Diện tích hiện tại không còn đủ, hoặc thao tác cùng khóa idempotency đang xử lý. Khóa đã dùng với dữ liệu khác trả 422 theo middleware chung.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - {$ref: "#/components/schemas/HouseholdSeasonAreaConflict"}
                  - {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      summary: Danh sách vụ theo hộ trong phạm vi HTX (AH-61)
      description: Thành viên và Đại diện đọc cùng HTX; Admin chọn HTX. Vụ của hộ đã ngừng tham gia vẫn đọc được trong HTX của vụ.
      operationId: listHouseholdSeasons
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, completed, cancelled]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang vụ theo hộ, không dùng thửa giả
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HouseholdSeason"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 10001
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}:
    get:
      summary: Xem vụ theo hộ và snapshot SOP của vụ (AH-61)
      operationId: getHouseholdSeason
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Vụ cùng snapshot đã lưu, không đọc thay bằng SOP hiện hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdSeason"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 10011
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/plan-changes:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: changeHouseholdPlan
      summary: Tùy chỉnh quy trình của vụ đang canh tác (AH-113)
      description: Thành viên HTX/Admin (KHMV-FN-04 U); Đại diện chỉ xem. Một thay đổi mỗi yêu cầu — thêm việc, sửa ngày/vật tư, đổi chỗ (chỉ đổi thứ tự hiển thị trong giai đoạn), bỏ việc (việc SOP chuyển Bỏ qua, việc tự thêm bị xóa). Chỉ đổi bản chụp của vụ, SOP chuẩn không đổi. Việc đã xong không sửa, đổi chỗ, bỏ được (409 cropcycle.plan_step_resolved); việc tự thêm đã có nhật ký không xóa được. Khóa vụ rồi so expected_season_event_id (409 cropcycle.task_season_changed). Mỗi thay đổi ghi một sự kiện corrected chỉ ghi thêm (người, thời điểm, nội dung). Kiểm cửa sổ và vật tư theo luật của SOP.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_season_event_id, change]
              properties:
                expected_season_event_id: {type: string, format: uuid}
                change: {$ref: "#/components/schemas/HouseholdPlanChange"}
      responses:
        "200":
          description: Vụ sau thay đổi, checklist tính lại và câu mô tả đã ghi lịch sử; replay trả kết quả cũ
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [season, checklist, summary]
                properties:
                  season: {$ref: "#/components/schemas/HouseholdSeason"}
                  checklist: {$ref: "#/components/schemas/HouseholdChecklist"}
                  summary: {type: string}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10012
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/plan-history:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHouseholdPlanHistory
      summary: Lịch sử tùy chỉnh quy trình của vụ (AH-113)
      description: Người xem được vụ (kể cả Đại diện HTX cùng HTX) xem được. Mới nhất trước.
      responses:
        "200":
          description: Các thay đổi đã ghi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [event_id, actor_ref, event_time, summary]
                      properties:
                        event_id: {type: string, format: uuid}
                        actor_ref: {type: string, format: uuid}
                        event_time: {type: string, format: date-time}
                        summary: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 10013
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/task-records/{log_ref}/corrections:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: log_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: correctHouseholdTask
      summary: Sửa nhật ký việc kèm lý do (AH-126)
      description: Thành viên HTX/Admin (KHMV-FN-05 U); Đại diện chỉ xem. Bản ghi bù chỉ ghi thêm (cùng log_ref, supersedes_id = phiên bản hiện hành); GPS, ảnh và thời điểm ghi giữ như bản đầu. Lý do bắt buộc, ít nhất 10 ký tự (422 nếu thiếu). Dữ liệu sửa kiểm như khi ghi (ngày làm xong không sau ngày ghi, vật tư theo danh mục, liều 0 cần xác nhận). expected_record_id lệch → 409 cropcycle.task_record_changed; bản đã xóa → 409 cropcycle.task_record_voided; vụ dừng/hủy → 422 cropcycle.task_season_state.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_record_id, reason, state, done_on, materials]
              properties:
                expected_record_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10, maxLength: 500}
                state: {type: string, enum: [partial, done]}
                done_on: {type: string, format: date}
                note: {type: string, maxLength: 2000}
                zero_confirmed: {type: boolean, default: false}
                channel: {type: string, enum: [app, web], default: app}
                materials:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [dose_per_ha]
                    properties:
                      material_code: {type: string}
                      name: {type: string}
                      unit: {type: string}
                      dose_per_ha: {type: string, pattern: '^(0|[1-9][0-9]{0,8})(\.[0-9]{1,4})?$'}
      responses:
        "200":
          description: Bản ghi bù và checklist tính lại; replay trả kết quả cũ
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [record, checklist]
                properties:
                  record: {$ref: "#/components/schemas/HouseholdTaskRecord"}
                  checklist: {$ref: "#/components/schemas/HouseholdChecklist"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10014
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/task-records/{log_ref}/void:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: log_ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: voidHouseholdTask
      summary: Xóa mềm nhật ký việc hoặc bỏ tích việc đã xong, kèm lý do (AH-126)
      description: Thành viên HTX/Admin (KHMV-FN-05 D); Đại diện chỉ xem. Ghi bản ghi bù trạng thái voided — bản ghi ẩn khỏi checklist và tiến độ, không xóa cứng; nếu đó là bản "Đã xong" duy nhất thì việc về chưa xong. Lý do bắt buộc, ít nhất 10 ký tự.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_record_id, reason]
              properties:
                expected_record_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10, maxLength: 500}
                channel: {type: string, enum: [app, web], default: app}
      responses:
        "200":
          description: Bản ghi bù và checklist tính lại; replay trả kết quả cũ
          headers:
            Idempotent-Replayed: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [record, checklist]
                properties:
                  record: {$ref: "#/components/schemas/HouseholdTaskRecord"}
                  checklist: {$ref: "#/components/schemas/HouseholdChecklist"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 10015
  /v1/cooperatives/{ref}/households/{household_ref}/seasons/{season_ref}/task-records/{log_ref}/history:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: household_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: season_ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: log_ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHouseholdTaskHistory
      summary: Lịch sử các phiên bản của nhật ký việc (AH-126)
      description: Người xem được vụ (kể cả Đại diện HTX cùng HTX) xem được. Theo thứ tự ghi; mỗi phiên bản có người ghi (actor_ref), thời điểm (recorded_at), lý do sửa/xóa (correction_reason) và giá trị lúc đó.
      responses:
        "200":
          description: Các phiên bản, cũ nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HouseholdTaskRecord"}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 10015
    HouseholdPlanChange:
      type: object
      additionalProperties: false
      required: [kind]
      description: "Một thay đổi quy trình của vụ (AH-113): add cần step; edit cần step_seq, window, materials; move cần step_seq, direction; remove cần step_seq"
      properties:
        kind: {type: string, enum: [add, edit, move, remove]}
        step_seq: {type: integer, minimum: 1, maximum: 1000}
        direction: {type: string, enum: [up, down]}
        step:
          type: object
          additionalProperties: false
          required: [name, stage_seq, activity_code, window]
          properties:
            name: {type: string, minLength: 1, maxLength: 200}
            stage_seq: {type: integer, minimum: 1}
            activity_code: {type: string, enum: [lam_dat, gieo_sa, tuoi_nuoc, bon_phan, phun_thuoc, kiem_tra, thu_hoach, cat_tia, khac]}
            window: {$ref: "#/components/schemas/CropSOPWindow"}
            materials: {type: array, items: {$ref: "#/components/schemas/CropSOPMaterial"}}
            instruction: {type: string, maxLength: 2000}
        window: {$ref: "#/components/schemas/CropSOPWindow"}
        materials: {type: array, items: {$ref: "#/components/schemas/CropSOPMaterial"}}
# @ag-order: 10012
    SeasonCalendarInput:
      type: object
      additionalProperties: false
      required: [crop_code, season_code, season_year, sow_from, sow_to, recipients]
      properties:
        crop_code: {type: string, pattern: '^[A-Za-z0-9_.-]{1,40}$'}
        season_code: {type: string, pattern: '^[A-Za-z0-9_.-]{1,40}$'}
        season_year: {type: integer, minimum: 2000, maximum: 2100}
        sow_from: {type: string, format: date}
        sow_to: {type: string, format: date}
        recipients: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
# @ag-order: 10013
    SeasonCalendarRevisionInput:
      type: object
      additionalProperties: false
      required: [expected_event_id, crop_code, season_code, season_year, sow_from, sow_to, recipients]
      properties:
        expected_event_id: {type: string, format: uuid}
        crop_code: {type: string, pattern: '^[A-Za-z0-9_.-]{1,40}$'}
        season_code: {type: string, pattern: '^[A-Za-z0-9_.-]{1,40}$'}
        season_year: {type: integer, minimum: 2000, maximum: 2100}
        sow_from: {type: string, format: date}
        sow_to: {type: string, format: date}
        recipients: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
# @ag-order: 10014
    SeasonCalendar:
      type: object
      required: [calendar_ref, cooperative_ref, current_event_id, version, status, crop_code, season_code, season_year, sow_from, sow_to, can_manage, updated_at]
      properties:
        calendar_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        current_event_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [published, cancelled]}
        crop_code: {type: string}
        season_code: {type: string}
        season_year: {type: integer}
        sow_from: {type: string, format: date}
        sow_to: {type: string, format: date}
        can_manage: {type: boolean}
        recipients: {type: array, description: "Chỉ có khi can_manage=true", items: {type: string, format: uuid}}
        updated_at: {type: string, format: date-time}
# @ag-order: 10000
    HouseholdSeasonAreaInput:
      type: string
      description: Ha dạng chuỗi decimal dương, tối đa hai chữ số thập phân; server kiểm với diện tích còn lại
      pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,2})?$'
      not: {enum: ["0", "0.0", "0.00"]}
      examples: ["0.25", "1.50"]
# @ag-order: 10001
    HouseholdSeasonOpenInput:
      type: object
      additionalProperties: false
      required: [crop_code, season_code, season_year, variety_code, area_ha, anchor_date]
      properties:
        crop_code: {type: string, pattern: '^[A-Za-z0-9_.-]{1,40}$'}
        season_code: {type: string, pattern: '^[A-Za-z0-9_]{1,40}$'}
        season_year: {type: integer, minimum: 2000, maximum: 2100}
        variety_code: {type: string, pattern: '^[A-Za-z0-9_.-]{1,40}$'}
        area_ha: {$ref: "#/components/schemas/HouseholdSeasonAreaInput"}
        anchor_date: {type: string, format: date, description: "Mốc gốc theo ngày nghiệp vụ, không ràng buộc cửa sổ T−15/T+30"}
        sop_version_id:
          type: [string, "null"]
          format: uuid
          description: Phiên bản đang áp dụng trong nhóm SOP phù hợp. Bỏ trống để server tự chọn nếu chỉ có một SOP phù hợp.
        gps: {$ref: "#/components/schemas/CropGPS"}
        channel: {type: string, enum: [app, web], default: app}
        plan_changes: {type: array, maxItems: 200, description: "Tùy chỉnh quy trình trước khi lưu vụ (AH-113), áp theo thứ tự; SOP chuẩn không đổi", items: {$ref: "#/components/schemas/HouseholdPlanChange"}}
        copy_from_season_ref: {type: [string, "null"], format: uuid, description: "AH-139: sao chép giống và quy trình (kèm tùy chỉnh) từ vụ trước của chính hộ này (kể cả vụ đang canh tác). Loại cây, giống, SOP lấy theo vụ nguồn; nếu gửi thì phải khớp (422). Vụ nguồn ngoài phạm vi → 404 cropcycle.season_not_found. Vẫn kiểm diện tích còn lại và mốc gốc."}
# @ag-order: 10002
    HouseholdSeasonSOPSnapshot:
      type: object
      required: [template_ref, version_id, version_no, crop_code, anchor_name, stages, steps]
      properties:
        template_ref: {type: string, format: uuid}
        version_id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        crop_code: {type: string}
        name: {type: string}
        anchor_name: {type: string}
        stages: {type: array, items: {$ref: "#/components/schemas/CropSOPStage"}}
        steps: {type: array, items: {$ref: "#/components/schemas/CropSOPStep"}}
        custom:
          type: object
          description: "Lớp tùy chỉnh của riêng vụ (AH-113): việc tự thêm, sửa ngày/vật tư, việc bỏ qua, thứ tự hiển thị. Lịch và checklist đã áp lớp này."
          properties:
            added: {type: array, items: {$ref: "#/components/schemas/CropSOPStep"}}
            edits: {type: array, items: {type: object, properties: {seq: {type: integer}, window: {$ref: "#/components/schemas/CropSOPWindow"}, materials: {type: array, items: {$ref: "#/components/schemas/CropSOPMaterial"}}}}}
            skipped: {type: array, items: {type: integer}}
            order: {type: array, items: {type: object, properties: {stage_seq: {type: integer}, steps: {type: array, items: {type: integer}}}}}
            last_seq: {type: integer}
# @ag-order: 10003
    HouseholdSeason:
      type: object
      required: [season_ref, entry_kind, household_ref, cooperative_ref, commune_code, crop_code, season_code, season_year, variety_code, area_ha, anchor_date, expected_harvest_date, harvest_open_date, sop_snapshot, status, current_event_id, version, gps_missing, gps, opened_by, opened_at]
      properties:
        season_ref: {type: string, format: uuid}
        entry_kind: {type: string, enum: [household]}
        household_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string}
        crop_code: {type: string}
        season_code: {type: string}
        season_year: {type: integer}
        variety_code: {type: string}
        area_ha: {$ref: "#/components/schemas/Decimal"}
        anchor_date: {type: string, format: date}
        expected_harvest_date: {type: [string, "null"], format: date}
        harvest_open_date: {type: [string, "null"], format: date}
        sop_snapshot: {$ref: "#/components/schemas/HouseholdSeasonSOPSnapshot"}
        status: {type: string, enum: [open, completed, cancelled]}
        current_event_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        copied_from: {type: [string, "null"], format: uuid, description: "Vụ nguồn khi mở bằng sao chép (AH-139)"}
        gps_missing: {type: boolean, description: "Thiếu hoặc từ chối GPS, không suy diễn tọa độ thành xác minh ranh đất"}
        gps: {$ref: "#/components/schemas/CropGPS"}
        opened_by: {type: string, format: uuid}
        opened_at: {type: string, format: date-time}
# @ag-order: 10004
    HouseholdSeasonAreaConflict:
      allOf:
        - {$ref: "#/components/schemas/Problem"}
        - type: object
          required: [remaining_area_ha]
          properties:
            code: {type: string, enum: [cropcycle.household_area_exceeded]}
            remaining_area_ha: {$ref: "#/components/schemas/Decimal"}
            active_area_ha: {$ref: "#/components/schemas/Decimal"}
            land_area_ha: {$ref: "#/components/schemas/Decimal"}

# @ag-order: 10005
    SeasonSchedulePreviewInput:
      type: object
      additionalProperties: false
      required: [crop_code, variety_code, sop_version_id, area_ha, anchor_date]
      properties:
        crop_code: {type: string}
        variety_code: {type: string, minLength: 1}
        sop_version_id: {type: string, format: uuid}
        area_ha: {$ref: "#/components/schemas/HouseholdSeasonAreaInput"}
        anchor_date: {type: string, format: date}
        plan_changes: {type: array, maxItems: 200, description: "Tùy chỉnh quy trình đang soạn (AH-113)", items: {$ref: "#/components/schemas/HouseholdPlanChange"}}
# @ag-order: 10006
    SeasonSchedule:
      type: object
      required: [anchor_date, as_of_date, expected_harvest_date, sop_version_id, current_event_id, stages]
      properties:
        anchor_date: {type: string, format: date}
        as_of_date: {type: string, format: date}
        expected_harvest_date: {type: [string, "null"], format: date}
        sop_version_id: {type: string, format: uuid}
        current_event_id: {type: [string, "null"], format: uuid}
        stages:
          type: array
          items:
            type: object
            required: [seq, name, from_date, to_date, steps]
            properties:
              seq: {type: integer}
              name: {type: string}
              from_date: {type: [string, "null"], format: date}
              to_date: {type: [string, "null"], format: date}
              steps:
                type: array
                items: {$ref: "#/components/schemas/SeasonScheduleStep"}
# @ag-order: 10007
    SeasonScheduleStep:
      type: object
      required: [seq, stage_seq, task_seq, name, activity_code, window_kind, from_date, to_date, expected_date, status, undated]
      properties:
        seq: {type: integer}
        stage_seq: {type: integer}
        task_seq: {type: integer}
        name: {type: string}
        activity_code: {type: string}
        window_kind: {type: string, enum: [date_range, open, stage, none]}
        from_date: {type: [string, "null"], format: date}
        to_date: {type: [string, "null"], format: date}
        expected_date: {type: [string, "null"], format: date, description: "Ngày Từ; không lấy Đến"}
        status: {type: string, enum: [upcoming, due, overdue, waiting_anchor]}
        undated: {type: boolean, description: "Chỉ true cho Không ngày; luôn due, không overdue"}
        custom: {type: boolean, description: "Việc tự thêm vào quy trình của riêng vụ (AH-113); vắng mặt = việc của SOP"}

# @ag-order: 10008
    HouseholdTaskCompleteInput:
      type: object
      additionalProperties: false
      required: [step_seq, expected_season_event_id]
      properties:
        step_seq: {type: integer, minimum: 1, maximum: 1000}
        expected_season_event_id: {type: string, format: uuid}
        gps: {$ref: "#/components/schemas/CropGPS"}
        channel: {type: string, enum: [app, web], default: app}
# @ag-order: 10009
    HouseholdTaskDetailInput:
      type: object
      additionalProperties: false
      required: [step_seq, expected_season_event_id, state, done_on, materials, file_refs]
      properties:
        step_seq: {type: integer, minimum: 1, maximum: 1000}
        expected_season_event_id: {type: string, format: uuid}
        state: {type: string, enum: [partial, done]}
        done_on: {type: string, format: date}
        note: {type: string, maxLength: 2000}
        backfill_reason: {type: string, maxLength: 500}
        zero_confirmed: {type: boolean, default: false}
        gps: {$ref: "#/components/schemas/CropGPS"}
        channel: {type: string, enum: [app, web], default: app}
        file_refs: {type: array, maxItems: 5, uniqueItems: true, items: {type: string, format: uuid}}
        materials:
          type: array
          maxItems: 20
          items:
            type: object
            required: [dose_per_ha]
            properties:
              material_code: {type: string}
              name: {type: string, description: Chỉ dùng khi vật tư chưa có trong danh mục}
              unit: {type: string}
              dose_per_ha: {type: string, pattern: '^(0|[1-9][0-9]{0,8})(\.[0-9]{1,4})?$'}
    HouseholdTaskDetails:
      type: object
      required: [actual_materials, backfilled, zero_confirmed]
      properties:
        backfilled: {type: boolean}
        backfill_reason: {type: string}
        zero_confirmed: {type: boolean}
        actual_materials:
          type: array
          items:
            type: object
            required: [name, unit, dose_per_ha, quantity]
            properties:
              material_code: {type: string}
              name: {type: string}
              unit: {type: string}
              group: {type: string}
              fertilizer_type: {type: string}
              dose_per_ha: {$ref: "#/components/schemas/Decimal"}
              quantity: {type: string, description: Tổng thực tế chính xác bằng liều nhân diện tích một lần; tối đa sáu chữ số lẻ}
    HouseholdTaskRecord:
      type: object
      required: [id, log_ref, step_seq, state, done_on, sop_version_id, inputs, gps_missing, gps, actor_ref, event_time, recorded_at]
      properties:
        id: {type: string, format: uuid}
        log_ref: {type: string, format: uuid}
        step_seq: {type: integer}
        state: {type: string, enum: [done, partial, skipped, voided], description: "voided chỉ có trong lịch sử (bản ghi đã xóa/bỏ tích, AH-126)"}
        done_on: {type: string, format: date}
        sop_version_id: {type: string, format: uuid}
        version: {type: integer, description: "Số phiên bản trong chuỗi của bản ghi (1 = bản đầu)"}
        correction_reason: {type: string, description: "Lý do sửa/xóa của phiên bản bù (AH-126)"}
        inputs:
          type: array
          items:
            type: object
            required: [name, qty, unit]
            properties:
              name: {type: string}
              qty: {$ref: "#/components/schemas/Decimal"}
              unit: {type: string}
        gps_missing: {type: boolean}
        gps: {$ref: "#/components/schemas/CropGPS"}
        actor_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        details: {$ref: "#/components/schemas/HouseholdTaskDetails"}
        note: {type: string}
        file_refs: {type: array, items: {type: string, format: uuid}}
# @ag-order: 10010
    HouseholdTaskProgress:
      allOf:
        - {$ref: "#/components/schemas/SeasonScheduleStep"}
        - type: object
          required: [completion_status, done_on, can_complete]
          properties:
            completion_status: {type: string, enum: [upcoming, due, overdue, waiting_anchor, done, done_early, done_on_time, done_late, skipped]}
            done_on: {type: [string, "null"], format: date}
            can_complete: {type: boolean}
# @ag-order: 10011
    HouseholdChecklist:
      type: object
      required: [season_ref, current_event_id, progress, records]
      properties:
        season_ref: {type: string, format: uuid}
        current_event_id: {type: string, format: uuid}
        records: {type: array, items: {$ref: "#/components/schemas/HouseholdTaskRecord"}}
        progress:
          type: object
          required: [as_of_date, done, skipped, total, percent, stages]
          properties:
            as_of_date: {type: string, format: date}
            done: {type: integer}
            skipped: {type: integer}
            total: {type: integer}
            percent: {type: [string, "null"], description: "Decimal phần trăm; null khi mẫu số bằng 0"}
            stages:
              type: array
              items:
                type: object
                required: [seq, name, status, tasks]
                properties:
                  seq: {type: integer}
                  name: {type: string}
                  status: {type: string, enum: [not_started, in_progress, done]}
                  tasks: {type: array, items: {$ref: "#/components/schemas/HouseholdTaskProgress"}}
