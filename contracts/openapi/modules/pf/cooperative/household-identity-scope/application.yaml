paths:
# @ag-order: 285001
  /v1/cooperatives/{ref}/household-identity-scope:
    get:
      summary: "FN-04: owner xác minh phạm vi đăng ký định danh hộ, chỉ metadata"
      operationId: householdRegistrationScope
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Không cache, không PII. Admin mọi HTX trong tenant; Đại diện đúng HTX mình. Thành viên không được đăng ký hộ."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdIdentityScope"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 285002
  /v1/households/{ref}/identity-scope:
    get:
      summary: "FN-04: owner xác minh phạm vi đọc/sửa định danh hộ, chỉ metadata"
      operationId: householdIdentityScope
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Không cache, không gọi Vault. Vai KN đi kèm không mở rộng phạm vi native; Thành viên chỉ được liên hệ đã che."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdIdentityScope"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 285003
  /v1/households/{ref}/profile:
    get:
      summary: "FN-04: chi tiết hộ theo vai HTX; định danh đã che tại server cho Member"
      operationId: nativeHouseholdProfile
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Chỉ dữ liệu thuộc quyền hiện tại, no-store; không giữ transaction khi gọi Vault"
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NativeHouseholdProfile"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 285001
    HouseholdIdentityScope:
      type: object
      additionalProperties: false
      required: [ref, cooperative_ref, active, contact_access, can_write]
      properties:
        ref: {type: string, format: uuid}
        cooperative_ref: {type: [string, "null"], format: uuid}
        active: {type: boolean}
        contact_access: {type: string, enum: [full, masked]}
        can_write: {type: boolean}
        shared: {type: boolean, description: Quyền chia sẻ hiện hành chỉ xem và che định danh}
# @ag-order: 285002
    NativeHouseholdProfile:
      type: object
      additionalProperties: false
      required: [household, identity, contact_access, code, revision]
      properties:
        household: {$ref: "#/components/schemas/Household"}
        code: {type: string, readOnly: true}
        revision: {type: integer, minimum: 1}
        contact_access: {type: string, enum: [full, masked]}
        identity:
          type: object
          additionalProperties: false
          required: [full_name, phone, national_id, address]
          properties:
            full_name: {type: string}
            phone: {type: string}
            national_id: {type: string}
            address: {type: string}
