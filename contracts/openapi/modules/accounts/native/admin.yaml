paths:
# @ag-order: 27500
  /v1/accounts/htx-users:
    get:
      summary: Danh sách tài khoản FN-07 trong tenant (Admin, realm HTX)
      description: Chỉ Admin đã qua MFA. Snapshot đầy đủ tối đa 2000 tài khoản IAM; vượt giới hạn trả lỗi. Cache-Control no-store.
      responses:
        '200':
          description: Danh sách đầy đủ cho bộ lọc, số đếm và phân trang UX-01
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountsUser' }
    post:
      summary: Tạo tài khoản FN-07 trong realm HTX (Admin)
      description: Một HTX, tối đa hai vai Đại diện/Thành viên; Admin không HTX. Mật khẩu tạm 8 ký tự chỉ trả một lần, bắt đổi lần đầu; replay không trả mật khẩu.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, full_name, phone, roles]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                full_name: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                email: { type: string, description: Bắt buộc với Admin để nhận OTP email }
                cooperative_ref: { type: [string, 'null'], format: uuid }
                roles:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { type: string, enum: [platform_admin, coop_manager, htx_member] }
      responses:
        '201':
          description: Đã tạo, mật khẩu chỉ trong phản hồi này; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeHTXAccountCreated' }
        '200':
          description: Phát lại, mật khẩu null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeHTXAccountCreated' }
# @ag-order: 27501
  /v1/accounts/htx-users/{id}:
    get:
      summary: Chi tiết tài khoản FN-07 (Admin, realm HTX)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tài khoản trong tenant hiện tại, không có mật khẩu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsUser' }
# @ag-order: 27503
  /v1/accounts/htx-users/{id}/revisions:
    post:
      summary: Sửa tài khoản FN-07 (Admin, realm HTX)
      description: |
        AH-276: sửa họ tên, SĐT, email, HTX; tên đăng nhập và vai chính không sửa được (FN-07/AC-06, BR-03).
        also_member chỉ áp cho Đại diện HTX (kiêm Thành viên HTX, QTPQ-Q-23), vắng = giữ nguyên. Đổi HTX: cả hai vai
        cùng chuyển, mọi phiên đang mở bị thu hồi (QTPQ-Q-21, Q-22). Không tự đổi HTX hoặc vai của chính mình.
        Chuyển Đại diện HTX cuối cùng còn hoạt động sang HTX khác cần xác nhận (confirm_no_representative).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: confirm_no_representative
          in: query
          required: false
          description: |
            FN-TK-02/EX-04 (AH-223): true = người dùng đã xác nhận thao tác làm HTX không còn Đại diện HTX nào đang hoạt
            động. Thiếu khi cần → 409 accounts.last_representative ("HTX sẽ không còn người duyệt kết quả lô"); gửi lại
            với true và Idempotency-Key mới.
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name, phone]
              properties:
                full_name: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                email: { type: string, description: Bắt buộc với Admin để nhận OTP email }
                cooperative_ref: { type: [string, 'null'], format: uuid }
                also_member: { type: boolean, description: Chỉ với Đại diện HTX; vắng = giữ nguyên }
      responses:
        '200':
          description: Tài khoản sau khi sửa (replayed = true khi phát lại cùng khóa); Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeHTXAccountChanged' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
# @ag-order: 27504
  /v1/accounts/htx-users/{id}/lock:
    post:
      summary: Khóa tài khoản FN-07 (Admin)
      description: AH-276, FN-07/AC-07, BR-06, BR-07 — đăng nhập bị chặn, mọi phiên bị thu hồi, dữ liệu giữ nguyên; không tự khóa chính mình. Khóa Đại diện HTX cuối cùng còn hoạt động của HTX cần xác nhận (FN-TK-02/EX-04).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: confirm_no_representative
          in: query
          required: false
          description: |
            FN-TK-02/EX-04 (AH-223): true = người dùng đã xác nhận thao tác làm HTX không còn Đại diện HTX nào đang hoạt
            động. Thiếu khi cần → 409 accounts.last_representative ("HTX sẽ không còn người duyệt kết quả lô"); gửi lại
            với true và Idempotency-Key mới.
          schema: { type: boolean }
      responses:
        '200':
          description: Đã khóa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeHTXAccountChanged' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
# @ag-order: 27505
  /v1/accounts/htx-users/{id}/unlock:
    post:
      summary: Mở khóa tài khoản FN-07 (Admin)
      description: AH-276, FN-07/AC-07 — đăng nhập lại được; không tự mở khóa chính mình.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Đã mở khóa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeHTXAccountChanged' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
# @ag-order: 27507
  /v1/accounts/htx-users/{id}/password-reset:
    post:
      summary: "FN-10 Đặt lại mật khẩu (Admin)"
      description: |
        AH-281. Kênh SMS bật → gửi mã OTP tới số đã lưu (mode otp_sent, phone_hint); kênh tắt → cấp mật khẩu tạm 08 ký tự chỉ
        trong phản hồi đầu (mode temporary_password), mật khẩu cũ hết hiệu lực, phiên bị thu hồi, phải đổi ở lần đăng nhập
        kế tiếp. Không cho chính mình (403), tài khoản đã khóa (409); ngoài phạm vi → 404. Phát lại không trả mật khẩu.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Đã gửi mã OTP hoặc đã cấp mật khẩu tạm; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHTXPasswordReset'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
components:
  schemas:
# @ag-order: 27508
    NativeHTXPasswordReset:
      type: object
      required: [mode, temporary_password, phone_hint, replayed]
      properties:
        mode: {type: string, enum: [temporary_password, otp_sent]}
        temporary_password: {type: [string, 'null'], description: Chỉ phản hồi đầu; không ghi log hoặc lưu cache}
        phone_hint: {type: string, description: SĐT đã che khi mode otp_sent}
        replayed: {type: boolean}
# @ag-order: 27506
    NativeHTXAccountChanged:
      type: object
      required: [user, replayed]
      properties:
        user: { $ref: '#/components/schemas/AccountsUser' }
        replayed: { type: boolean }
# @ag-order: 27502
    NativeHTXAccountCreated:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: '#/components/schemas/AccountsUser' }
        temporary_password: { type: [string, 'null'], description: Chỉ phản hồi đầu tiên; không ghi log hoặc lưu cache }
# @ag-end
