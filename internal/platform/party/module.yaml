# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/party
aka: [k/orgtree, k/access]
hosts: [cap/import]
kind: kernel
zones: [pf]
version: 2.0.0
depends:
  pf/kref: ">=1.0 <2"
  pf/sync: ">=1.0 <2"
  vault/identity: ">=1.0 <2"
provides:
  ports:
    - APIReadLog
    - ActorNames
    - AdminUnitTree
    - AdminUnits
    - ConsentChecker
    - ConsentStates
    - ContextEpochs
    - CoopMachineCounts
    - CoopMarkers
    - CoopProfiles
    - CooperativeAccountUsers
    - CooperativeAreaSource
    - CooperativePrivateReferences
    - CooperativeRegistrar
    - CooperativeUnitCounts
    - DepartmentAdmin
    - DepartmentUsage
    - Departments
    - FormAvailability
    - FourEyes
    - GrantLookup
    - HTXProfileEditor
    - Households
    - InventoryMachineSource
    - ModuleEnablement
    - NativeCooperativeSharing
    - OrgCodes
    - OrgDirectory
    - OrgImpactSource
    - Orgs
    - PartnerAccess
    - PlotStats
    - Regions
    - ScopeResolver
    - SeasonActivity
    - SessionContext
    - TenantTransfers
    - TransferTokenVerifier
    - ValveGrants
    - grantlookup.CoopLocations
  events:
    - pf.party.consent.recorded/v1
    - pf.party.context_epoch.bumped/v1
    - pf.party.org.created/v1
    - pf.party.org.deactivated/v1
    - pf.party.org.deleted/v1
    - pf.party.org.moved/v1
    - pf.party.org.reactivated/v1
    - pf.party.share_grant.approved/v1
    - pf.party.share_grant.revoked/v1
    - pf.party.share_read.recorded/v1
  internal_events: []
  publications: [pf_party_pub.cooperative_references/v1, pf_party_pub.org_tree/v1]
  data_products: []
consumes:
  events: []
  publications:
    - pf_accounts_pub.cooperative_references/v1
    - pf_contact_pub.cooperative_references/v1
    - pf_cooperative_pub.cooperative_references/v1
    - pf_cropcycle_pub.cooperative_references/v1
    - pf_extension_pub.cooperative_references/v1
    - pf_geo_pub.cooperative_references/v1
    - pf_hrm_pub.cooperative_references/v1
    - pf_mechanization_pub.cooperative_references/v1
    - pf_notify_pub.cooperative_references/v1
    - pf_party_pub.cooperative_references/v1
    - pf_sync_pub.cooperative_references/v1
permissions:
    - cgh_viewer
    - consent_reader
    - consent_writer
    - coop_manager
    - htx_member
    - kn_national_admin
    - kn_officer
    - kn_province_admin
    - mkg_sync
    - registry_admin
shares: []
owns_schema: [pf_party, pf_party_pub]
enable: always
